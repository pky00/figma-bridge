[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "figma-bridge"
version = "0.1.0"
description = "Drive the Figma desktop app from an AI agent through a local MCP server and a development plugin. Local only: no cloud API, no rate limits."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "starlette>=0.51",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "mcp>=2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
figma-bridge = "figma_bridge.cli:main"

[tool.setuptools]
packages = ["figma_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
